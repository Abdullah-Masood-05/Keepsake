# Single source of truth for Keepsake cloud builds.
#
#   check           typecheck, lint, bun tests (if any), pytest (Android bridge), yt-dlp-ejs pin
#                   assert, frontend build, cargo test, clippy (non-blocking)
#   windows         NSIS installer, then scripts/verify-bundle.ps1 installs it silently and fails
#                   if keepsake-yt-dlp/-ffmpeg/-qjs are not next to the app or do not run (needs: check)
#   linux           deb, rpm, AppImage, then scripts/verify-bundle.sh unpacks each package and
#                   fails if a sidecar is missing from usr/bin or does not run    (needs: check)
#   android         arm64-v8a split APK, test-signed, Chaquopy + yt-dlp + yt-dlp-ejs, bundled
#                   libqjs.so + libffmpeg.so, APK verification  (needs: check). libffmpeg.so is
#                   downloaded and sha256-verified by scripts/fetch-android-binaries.sh from the
#                   ffmpeg-android-minimal-build release pinned in scripts/binaries.lock.json.
#   release         draft GitHub Release, v* tags only  (needs: windows, linux, android; never
#                   runs if one failed). Includes the FFmpeg/LAME/Opus corresponding-source tarball
#                   (LGPL) from the same ffmpeg-android-minimal-build release, sha256-verified.
#
# windows/linux were switched off (`if: false`, commit 9c0697a "Android-only builds for now") by
# choice, not because a step was broken. They are back on: the Windows installer is the build the
# user relies on, and CI must prove every sidecar is inside it.
#
# Every build job writes artifact sizes to its job summary.
# Builds are NOT code-signed (see README.md). No signing secrets are used here.
# Assumes the repository root is the Keepsake folder. If it is a subfolder, set KEEPSAKE_DIR.
name: build

on:
  push:
    branches: [main, android-app]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel a run when a newer commit lands on the same branch, PR or tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KEEPSAKE_DIR: .
  BUN_VERSION: "1.4.4" # same as the local dev machine and docker/android/Dockerfile
  # Rust is pinned to 1.90.0 (MSRV in src-tauri/Cargo.toml) via dtolnay/rust-toolchain@1.90.0 in every job.
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.KEEPSAKE_DIR }}
    steps:
      - uses: actions/checkout@v4

      # cargo test compiles the Tauri crate, which needs the same system libraries as the Linux build.
      - name: Linux system packages (Tauri v2 prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xz-utils

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.KEEPSAKE_DIR }}/src-tauri -> target

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # bun test exits non-zero when it finds no test files, so only run it when some exist.
      - name: Unit tests (bun)
        run: |
          tests="$(git ls-files '*.test.ts' '*.test.tsx' '*.spec.ts' '*.spec.tsx' '*_test.ts' '*_spec.ts' | grep -v -e '^node_modules/' -e '^src-tauri/' || true)"
          if [ -z "$tests" ]; then
            echo "No bun test files found; skipping."
          else
            echo "$tests"
            bun test
          fi

      # Host Python for the Android bridge's pure modules (no yt_dlp import, no device needed).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (pytest, Android Python bridge)
        env:
          PYTHONPATH: src-tauri/plugins/keepsake-media/android/src/main/python
        run: |
          python -m pip install --disable-pip-version-check "pytest==8.4.2"
          python -m pytest -q src-tauri/plugins/keepsake-media/android/src/test/python

      # yt-dlp checks the EJS solver's version and hashes against its own vendored table, so the
      # gradle `yt-dlp-ejs` pin must equal the `yt-dlp-ejs==` pin in the pinned yt-dlp's pyproject.
      # The pyproject pin is read from the yt-dlp wheel's METADATA (Requires-Dist), fetched from
      # PyPI with pip's own retries. Chaquopy downloads the same wheel from PyPI during the APK
      # build, so this adds no new network dependency; no hash table to keep in sync by hand.
      - name: Assert yt-dlp-ejs pin equals the pinned yt-dlp's pin
        run: |
          G=src-tauri/plugins/keepsake-media/android/build.gradle.kts
          ytdlp="$(sed -n 's/.*install("yt-dlp==\([^"]*\)").*/\1/p' "$G")"
          ejs="$(sed -n 's/.*install("yt-dlp-ejs==\([^"]*\)").*/\1/p' "$G")"
          echo "gradle: yt-dlp=[$ytdlp] yt-dlp-ejs=[$ejs]"
          if [ -z "$ytdlp" ] || [ -z "$ejs" ] || [ "$(printf '%s\n' "$ytdlp" | wc -l)" != 1 ] || [ "$(printf '%s\n' "$ejs" | wc -l)" != 1 ]; then
            echo "::error file=$G::expected exactly one install(\"yt-dlp==X\") and one install(\"yt-dlp-ejs==Y\")"
            exit 1
          fi
          WHL="$RUNNER_TEMP/ytdlp-wheel"
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
            --retries 5 --timeout 60 -d "$WHL" "yt-dlp==$ytdlp"
          want="$(python - "$WHL" <<'PY'
          import glob, re, sys, zipfile
          whl = glob.glob(sys.argv[1] + "/yt_dlp-*.whl")
          assert len(whl) == 1, whl
          z = zipfile.ZipFile(whl[0])
          meta = [n for n in z.namelist() if n.endswith(".dist-info/METADATA")]
          assert len(meta) == 1, meta
          pins = set(re.findall(r"(?im)^Requires-Dist:\s*yt[-_.]dlp[-_.]ejs\s*==\s*([^\s;,]+)", z.read(meta[0]).decode()))
          assert len(pins) == 1, "yt-dlp-ejs pins in METADATA: %r" % pins
          print(pins.pop())
          PY
          )"
          echo "yt-dlp $ytdlp pins yt-dlp-ejs==$want"
          if [ "$want" != "$ejs" ]; then
            echo "::error file=$G::yt-dlp-ejs==$ejs but yt-dlp $ytdlp requires yt-dlp-ejs==$want. Bump both pins together."
            exit 1
          fi

      # Produces dist/ (frontendDist) so the Rust crate compiles the same way as in a release build.
      - name: Frontend build
        run: bun run build

      # tauri-build copies every externalBin sidecar at compile time, so it fails if they are missing.
      # Unit tests never run them, so empty placeholders named from tauri.conf.json are enough.
      - name: Placeholder sidecars for cargo test
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          for bin in $(jq -r '.bundle.externalBin[]' src-tauri/tauri.conf.json); do
            touch "src-tauri/$bin-$triple"
            chmod +x "src-tauri/$bin-$triple"
            echo "placeholder: src-tauri/$bin-$triple"
          done

      - name: cargo test
        working-directory: ${{ env.KEEPSAKE_DIR }}/src-tauri
        run: cargo test

      # Advisory only: reports lints as annotations, never fails the job.
      - name: cargo clippy (non-blocking)
        continue-on-error: true
        working-directory: ${{ env.KEEPSAKE_DIR }}/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ env.KEEPSAKE_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-pc-windows-msvc

      # Sidecar names must match the host triple Tauri sees.
      - name: Check the MSVC host triple
        run: |
          $hostTriple = (rustc -vV | Select-String '^host: ').Line.Substring(6).Trim()
          Write-Host "rustc $(rustc --version), host: $hostTriple"
          if ($hostTriple -ne 'x86_64-pc-windows-msvc') { throw "expected msvc host, got $hostTriple" }

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.KEEPSAKE_DIR }}/src-tauri -> target

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Downloads yt-dlp, ffmpeg and qjs into src-tauri/binaries and verifies each sha256.
      - name: Fetch sidecars (sha256-verified)
        run: ./scripts/fetch-binaries.ps1 -Triple x86_64-pc-windows-msvc

      - run: bun install --frozen-lockfile

      - name: Build installer (NSIS)
        run: bun run tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: keepsake-windows-nsis
          path: ${{ env.KEEPSAKE_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Size report
        run: |
          $rows = @()
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe) + @(Get-ChildItem src-tauri/binaries -File)
          foreach ($f in $files) {
            $rows += "| $($f.Name) | $([math]::Round($f.Length / 1MB, 2)) MB | $($f.Length) |"
          }
          $files | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          $md = @("### Windows sizes", "", "| File | Size | Bytes |", "|---|---|---|") + $rows
          $md -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # After the upload, so the installer is downloadable even when this check fails.
      # Installs silently (currentUser) and fails if a sidecar is missing, altered or does not run.
      - name: Verify bundled sidecars in the installer
        run: ./scripts/verify-bundle.ps1 -BundleDir src-tauri/target/release/bundle/nsis -Triple x86_64-pc-windows-msvc

  linux:
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.KEEPSAKE_DIR }}
    steps:
      - uses: actions/checkout@v4

      # rpm: rpm2cpio + cpio for scripts/verify-bundle.sh (unpacks the .rpm).
      - name: Linux system packages (Tauri v2 prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xz-utils \
            rpm cpio squashfs-tools

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.KEEPSAKE_DIR }}/src-tauri -> target

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Downloads yt-dlp, ffmpeg and qjs into src-tauri/binaries and verifies each sha256.
      - name: Fetch sidecars (sha256-verified)
        run: bash scripts/fetch-binaries.sh x86_64-unknown-linux-gnu

      - run: bun install --frozen-lockfile

      # NO_STRIP: linuxdeploy (AppImage) strips ELF files in usr/bin by default. Stripping a
      # PyInstaller one-file binary (keepsake-yt-dlp) cuts off its appended archive and breaks it.
      # The app binary itself is already stripped by Cargo (profile.release strip = true).
      - name: Build packages (deb, rpm, AppImage)
        env:
          NO_STRIP: "true"
        run: bun run tauri build --bundles deb,rpm,appimage

      # linuxdeploy runs patchelf on every ELF in usr/bin (NO_STRIP does not stop that); the
      # added RUNPATH breaks static-pie sidecars such as keepsake-qjs, which then segfaults.
      # Put the pristine sidecars back and repack the AppImage from its own runtime.
      - name: Restore pristine sidecars in the AppImage
        run: bash scripts/repair-appimage-sidecars.sh src-tauri/target/release/bundle x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: keepsake-linux-deb
          path: ${{ env.KEEPSAKE_DIR }}/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: keepsake-linux-rpm
          path: ${{ env.KEEPSAKE_DIR }}/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: keepsake-linux-appimage
          path: ${{ env.KEEPSAKE_DIR }}/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Size report
        run: |
          B=src-tauri/target/release/bundle
          ls -l $B/deb/*.deb $B/rpm/*.rpm $B/appimage/*.AppImage src-tauri/binaries
          {
            echo "### Linux sizes"
            echo ""
            echo "| File | Size | Bytes |"
            echo "|---|---|---|"
            for f in $B/deb/*.deb $B/rpm/*.rpm $B/appimage/*.AppImage src-tauri/binaries/*; do
              [ -f "$f" ] || continue
              bytes=$(stat -c %s "$f")
              echo "| $(basename "$f") | $(numfmt --to=iec --suffix=B "$bytes") | $bytes |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # After the uploads, so the packages are downloadable even when this check fails.
      # Unpacks each deb/rpm/AppImage and fails if a sidecar is missing from usr/bin or does not run.
      - name: Verify bundled sidecars in every package
        run: bash scripts/verify-bundle.sh src-tauri/target/release/bundle x86_64-unknown-linux-gnu

  # No desktop fetch-binaries here: tauri.android.conf.json sets "externalBin": [] (no sidecars).
  # The Android executables (libqjs.so, libffmpeg.so) are jniLibs of the keepsake-media plugin
  # instead (plan 11, section 3.1).
  # Builds a RELEASE arm64-v8a APK (realistic size) and signs it with a throwaway key generated
  # in this job, the same way docker/android/build.sh does without /keys. TEST ONLY: each run has
  # a new key, so a newer CI APK will not install over an older one without uninstalling first.
  android:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.KEEPSAKE_DIR }}
    env:
      NDK_VERSION: "27.2.12479018"
      BUILD_TOOLS: "37.0.0"
      JNI_DIR: src-tauri/plugins/keepsake-media/android/src/main/jniLibs/arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy compiles the app's Python with a build-machine Python of the same minor version (3.12).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # We do not use android-actions/setup-android: its startup runs `sdkmanager tools`, which
      # fails on current SDK package indexes ("Failed to find package 'tools'"). The runner image
      # already ships the Android SDK, so install the packages we need straight into it.
      - name: Install Android platform, build tools and NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # The preinstalled cmdline-tools is too old to see new platforms. Update it first.
          "$SDKMANAGER" --install "cmdline-tools;latest" || true
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          # API 37+ packages use a minor version (android-37.0). Must match the generated Gradle
          # project: Tauri CLI 2.12 writes compileSdk = 37 / targetSdk = 37.
          "$SDKMANAGER" --install "platform-tools" "build-tools;$BUILD_TOOLS" "platforms;android-37.0" "ndk;$NDK_VERSION"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # arm64-only build, so only the aarch64 Rust target is needed.
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.KEEPSAKE_DIR }}/src-tauri -> target

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # src-tauri/gen is git-ignored, so the Android project is generated on every run.
      - name: tauri android init
        run: bun run tauri android init --ci

      - name: Patch Gradle for Chaquopy (fails if the patch does not apply)
        run: bash scripts/android-patch-gradle.sh src-tauri/gen/android

      # Put Keepsake's launcher icon into the generated project and verify it, so the APK never
      # ships the template's default icon.
      - name: Copy and verify Android launcher icons
        run: |
          RES=src-tauri/gen/android/app/src/main/res
          SRC=src-tauri/icons/android
          mkdir -p "$RES/values"
          cp -r "$SRC"/mipmap-* "$RES/"
          cp "$SRC/values/ic_launcher_background.xml" "$RES/values/"
          ROOT="$PWD"
          cd "$SRC"
          for f in $(find . -type f); do
            cmp -s "$f" "$ROOT/$RES/$f" || { echo "launcher icon mismatch: $f" >&2; exit 1; }
          done
          echo "launcher icons copied and verified"

      # QuickJS-NG (yt-dlp's JS runtime for the EJS solver) as libqjs.so, sha256-pinned in
      # scripts/binaries.lock.json. libffmpeg.so is downloaded from the ffmpeg-android-minimal-build
      # release (pinned url + sha256 in the same file). Both are required: a failed download or a
      # hash mismatch fails the job.
      - name: Fetch Android binaries (libqjs.so, libffmpeg.so, sha256-verified)
        env:
          KEEPSAKE_ANDROID_REQUIRE: libqjs.so libffmpeg.so
        run: bash scripts/fetch-android-binaries.sh

      - name: Check bundled executables (jniLibs)
        run: |
          ls -l "$JNI_DIR"
          chmod 755 "$JNI_DIR"/*.so
          [ -f "$JNI_DIR/libqjs.so" ] || { echo "::error::libqjs.so missing after fetch-android-binaries.sh"; exit 1; }
          [ -f "$JNI_DIR/libffmpeg.so" ] || { echo "::error::libffmpeg.so missing after fetch-android-binaries.sh"; exit 1; }
          # ELF, aarch64 (e_machine 183) is required. 16 KiB LOAD alignment is warned about only:
          # the libs are extracted at install (legacy packaging), so it matters for 16 KiB-page devices.
          for f in "$JNI_DIR"/*.so; do
            python3 - "$f" <<'PY'
          import struct, sys
          p = sys.argv[1]
          b = open(p, "rb").read()
          if b[:4] != b"\x7fELF" or b[4] != 2 or b[5] != 1:
              sys.exit("::error::%s is not a 64-bit little-endian ELF" % p)
          e_machine, = struct.unpack_from("<H", b, 18)
          if e_machine != 183:
              sys.exit("::error::%s e_machine=%d, expected 183 (aarch64)" % (p, e_machine))
          phoff, = struct.unpack_from("<Q", b, 32)
          phentsize, phnum = struct.unpack_from("<HH", b, 54)
          aligns = [struct.unpack_from("<Q", b, phoff + i * phentsize + 48)[0]
                    for i in range(phnum) if struct.unpack_from("<I", b, phoff + i * phentsize)[0] == 1]
          print("%s: aarch64 ELF, %d bytes, LOAD align %s" % (p, len(b), [hex(a) for a in aligns]))
          if not aligns or min(aligns) < 0x4000:
              print("::warning::%s LOAD segments are not 16 KiB aligned: %s" % (p, [hex(a) for a in aligns]))
          PY
          done

      - name: Build release APK (arm64-v8a, split per ABI)
        run: bun run tauri android build --apk --split-per-abi --target aarch64 --ci

      # Release APKs come out unsigned. Sign with ONE stable test key from the repo secrets, so each
      # build can be installed over the previous one. Without the secrets a throwaway key is
      # generated and installs over earlier CI builds will fail (uninstall first).
      - name: Test-sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          KS="$RUNNER_TEMP/ci-test.keystore"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"; ALIAS=keepsake-test
          else
            echo "::warning::ANDROID_TEST_KEYSTORE_B64 / _PASSWORD not set: using a throwaway key. Installing over earlier CI builds will fail."
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias ci-test \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Keepsake CI test key,O=Keepsake,C=US" > /dev/null
            PASS=android; ALIAS=ci-test
          fi
          OUT=apk-out
          rm -rf "$OUT" && mkdir -p "$OUT"
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          found=0
          while IFS= read -r f; do
            found=1
            name="$(basename "$f" .apk)"
            case "$name" in
              *universal*) abi=universal ;;
              *arm64*)     abi=arm64-v8a ;;
              *)           abi="$name" ;;
            esac
            dest="$OUT/keepsake-$VERSION-$abi-testsigned.apk"
            # -P 16: uncompressed .so files 16 KiB page-aligned (checked again after upload).
            "$BT/zipalign" -f -P 16 4 "$f" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
              --ks-key-alias "$ALIAS" --out "$dest" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/aligned.apk" "$dest.idsig"
            "$BT/apksigner" verify "$dest"
            echo "signed $f -> $dest"
          done < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          [ "$found" = 1 ] || { echo "no APK produced" >&2; exit 1; }

      - name: APK size report
        run: |
          ls -l apk-out
          ls -lR src-tauri/gen/android/app/build/outputs/apk
          {
            echo "### Android sizes"
            echo ""
            echo "| File | Size | Bytes |"
            echo "|---|---|---|"
            for f in apk-out/*.apk; do
              bytes=$(stat -c %s "$f")
              echo "| $(basename "$f") | $(numfmt --to=iec --suffix=B "$bytes") | $bytes |"
            done
            echo ""
            for f in apk-out/*.apk; do
              echo "APK bytes: $(basename "$f") $(stat -c %s "$f")"
              echo ""
            done
            echo "Bundled executables (uncompressed bytes in jniLibs): $(stat -c '%n=%s' "$JNI_DIR"/*.so | sed 's#.*/##' | tr '\n' ' ')"
            echo ""
            echo "Signed with a per-run CI test key. For testing only; not for distribution."
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded before the checks below, so a phone-testable APK exists even if a check fails.
      - uses: actions/upload-artifact@v4
        with:
          name: keepsake-android-apk
          path: ${{ env.KEEPSAKE_DIR }}/apk-out/*.apk
          if-no-files-found: error

      # Plan 11 WP-I. Any miss fails the job (and so blocks a release). The only exception is the
      # Chaquopy asset path guess.
      - name: Verify APK (native libs, extractNativeLibs, 16 KiB alignment, yt-dlp-ejs)
        run: |
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          G=src-tauri/plugins/keepsake-media/android/build.gradle.kts
          EJS_PIN="$(sed -n 's/.*install("yt-dlp-ejs==\([^"]*\)").*/\1/p' "$G")"
          for apk in apk-out/*.apk; do
            echo "=== $apk ($(stat -c %s "$apk") bytes)"
            # 1. Executables packaged as lib/arm64-v8a/lib*.so. Legacy packaging stores them deflated.
            unzip -v "$apk" 'lib/arm64-v8a/*' > "$RUNNER_TEMP/libs.txt" || true
            cat "$RUNNER_TEMP/libs.txt"
            grep -q 'lib/arm64-v8a/libqjs\.so$' "$RUNNER_TEMP/libs.txt" || { echo "::error::$apk: lib/arm64-v8a/libqjs.so missing"; exit 1; }
            grep -q 'lib/arm64-v8a/libffmpeg\.so$' "$RUNNER_TEMP/libs.txt" || { echo "::error::$apk: lib/arm64-v8a/libffmpeg.so missing"; exit 1; }
            echo "libffmpeg.so present"
            # 2. extractNativeLibs must not be false (exec is only allowed from nativeLibraryDir).
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$RUNNER_TEMP/manifest.txt"
            line="$(grep -m1 'extractNativeLibs' "$RUNNER_TEMP/manifest.txt" || true)"
            echo "manifest: ${line:-<extractNativeLibs not set>}"
            case "$line" in
              "") echo "::notice::$apk: extractNativeLibs not set (platform default is true)" ;;
              *=true*|*0xffffffff*) echo "extractNativeLibs=true" ;;
              *) echo "::error::$apk: extractNativeLibs is not true: $line (useLegacyPackaging patch missing?)"; exit 1 ;;
            esac
            # useLegacyPackaging=true stores .so entries deflated; "Stored" means the patch did not apply.
            if grep -q 'Stored.*lib/arm64-v8a/libqjs\.so$' "$RUNNER_TEMP/libs.txt"; then
              echo "::warning::$apk: libqjs.so is stored uncompressed: useLegacyPackaging is probably off"
            fi
            # 3. 16 KiB page alignment (Android 15+ devices with 16 KiB pages, future Play upload).
            #    Only uncompressed .so entries are checked; with legacy packaging the ELF p_align check
            #    in "Check bundled executables" is what covers 16 KiB devices.
            "$BT/zipalign" -c -P 16 -v 4 "$apk" > "$RUNNER_TEMP/zipalign.txt" 2>&1 \
              || { tail -n 30 "$RUNNER_TEMP/zipalign.txt"; echo "::error::$apk: zipalign -c -P 16 4 failed"; exit 1; }
            echo "zipalign -P 16: OK"
            # 4. yt_dlp_ejs inside Chaquopy's pip requirements (assets/chaquopy/requirements-*.imy, zip
            #    files). The asset path is the only guess here: if no such asset exists, warn only.
            python3 - "$apk" "$EJS_PIN" <<'PY'
          import io, re, sys, zipfile
          apk, pin = sys.argv[1], sys.argv[2]
          outer = zipfile.ZipFile(apk)
          imys = [n for n in outer.namelist() if re.fullmatch(r"assets/chaquopy/requirements[^/]*\.imy", n)]
          print("Chaquopy requirement assets:", imys)
          if not imys:
              print("::warning::%s: no assets/chaquopy/requirements*.imy (asset path guess failed); yt_dlp_ejs NOT checked" % apk)
              sys.exit(0)
          names = []
          for n in imys:
              names += zipfile.ZipFile(io.BytesIO(outer.read(n))).namelist()
          if not any(n.startswith("yt_dlp_ejs/") for n in names):
              sys.exit("::error::%s: yt_dlp_ejs/ not found in %s" % (apk, imys))
          dist = sorted({n.split("/")[0] for n in names if re.match(r"yt_dlp_ejs-[^/]+\.dist-info/", n)})
          print("yt_dlp_ejs present; dist-info:", dist)
          if dist and dist != ["yt_dlp_ejs-%s.dist-info" % pin]:
              sys.exit("::error::%s: yt_dlp_ejs %s dist-info not found (got %s)" % (apk, pin, dist))
          PY
          done

  # Runs only for version tags (git tag v2.1.0 && git push origin v2.1.0). Collects every
  # platform artifact into a DRAFT GitHub Release, so you review it before publishing.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Every platform must be green (including the bundled-sidecar checks). The LGPL corresponding
    # source of libffmpeg.so is downloaded from its ffmpeg-android-minimal-build release (below).
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: keepsake-*
          path: release-files
          merge-multiple: true

      # LGPL-2.1 section 6: the exact FFmpeg/LAME/Opus sources behind libffmpeg.so ship next to the
      # APK. URL and sha256 come from scripts/binaries.lock.json (libffmpeg.so.sourcesUrl/sourcesSha256).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/binaries.lock.json
          path: lock-src

      - name: Download LGPL corresponding source of libffmpeg.so (sha256-verified)
        run: |
          read -r URL SHA < <(python3 - lock-src/scripts/binaries.lock.json <<'PY'
          import json, sys
          e = json.load(open(sys.argv[1]))["android"]["libs"]["libffmpeg.so"]
          print(e["sourcesUrl"], e["sourcesSha256"])
          PY
          )
          curl -fsSL --retry 3 -o release-files/libffmpeg-android-sources.tar.gz "$URL"
          echo "$SHA  release-files/libffmpeg-android-sources.tar.gz" | sha256sum -c -

      - name: List release files
        run: |
          ls -la release-files
          {
            echo "### Release files"
            echo ""
            echo "| File | Bytes |"
            echo "|---|---|"
            for f in release-files/*; do echo "| $(basename "$f") | $(stat -c %s "$f") |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          # Tags with a suffix (v2.1.0-rc.1) are marked pre-release; plain tags (v2.1.0) are production.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-files/*
