[project]
name = "satchel"
version = "2.1.1"
description = "Desktop video and audio downloader for YouTube and 1,800+ other sites, built on yt-dlp and PyQt6"
readme = "Readme.md"
authors = [
    { name = "Abdullah Masood", email = "Abdullah-Masood-05@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqt6>=6.5.0",
    "requests>=2.31.0",
    "yt-dlp[default,curl-cffi]>=2024.1.1",
    # Linux: lets yt-dlp decrypt Chrome/Chromium cookies (cookies-from-browser)
    "secretstorage>=3.3.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
    "ordered-set>=4.1.0",
    "pillow>=10.0.0",
    "zstandard>=0.22.0",
]

[tool.uv]
package = false
